# Só um contexto Spring vivo por vez nos testes.
# O SingletonDB guarda o pool de conexões num atributo estático: com dois contextos abertos (testes com
# configurações diferentes), ele fica apontando para o pool do último, e as gravações de um teste
# @Transactional passam por fora da transação do teste e ficam no banco de verdade.
spring.test.context.cache.maxSize=1
