spring.application.name=SIGG_BACKEND
spring.datasource.url=jdbc:postgresql://localhost:5432/Escoteiros
spring.datasource.username=postgres
spring.datasource.password=postgres123

spring.jpa.hibernate.ddl-auto=none

server.servlet.session.cookie.name=SIGGSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SIGG_COOKIE_SECURE:false}
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=never

sigg.seguranca.ativa=true
sigg.cors.origens=${SIGG_CORS_ORIGENS:http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:5500}
sigg.front.url=${SIGG_FRONT_URL:http://localhost:5173}
sigg.email.ativo=${SIGG_EMAIL_ATIVO:false}
sigg.email.remetente=${SIGG_EMAIL_REMETENTE:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
